name: Compare Maven Dependencies

on:
  push:
    branches:
      - main

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sandbox Repo
        uses: actions/checkout@v4

      - name: Checkout Prod Repo
        uses: actions/checkout@v4
        with:
          repository: adityajain773568-commits/unity-prod
          path: prod

      - name: Verify files
        run: |
          echo "Sandbox:"
          ls -la
          echo ""
          echo "Prod:"
          ls -la prod

      - name: Compare dependency versions
        shell: bash
        run: |
          echo "=== Dependency Version Comparison ==="

          grep -E "<groupId>|<artifactId>|<version>" pom.xml > sandbox.txt
          grep -E "<groupId>|<artifactId>|<version>" prod/pom.xml > prod.txt

          if diff sandbox.txt prod.txt > diff.txt; then
            echo "✅ All dependency versions match."
          else
            echo "❌ Version mismatches found:"
            echo ""
            cat diff.txt
            exit 1
          fi
